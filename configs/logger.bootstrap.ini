service_name = mp-service
environment_name = development
build_version = 0.0.0

[logger]
buffer_capacity = 1024
message_capacity = 512
context_capacity = 1024
field_capacity = 8
field_key_capacity = 32
field_value_capacity = 128
format = json
pretty_output = false
log_directory = .
file_name_prefix = mp-service
backup_file_name_prefix = mp-logger-internal
active_streams = stdout,stderr,file

[stdout]
minimum_level = trace
maximum_level = info

[stderr]
minimum_level = warning
maximum_level = fatal

[file]
minimum_level = trace
maximum_level = fatal

[udp]
minimum_level = error
maximum_level = fatal
host = 127.0.0.1
port = 5514
